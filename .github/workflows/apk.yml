name: apk

# Builds the Android APK from the PWA build (dist/) via Capacitor and
# publishes it to the "apk-latest" GitHub Release (installable download).
# Runs manually (Actions tab -> apk -> Run workflow) and on every push to
# main that touches the app.
#
# Release signing: add repo secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD to get a signed release APK.
# Without them we build the auto-signed debug APK (sideload-installable).
# NOTE: never reference `secrets` in a step `if:` — that makes the whole
# workflow invalid (GitHub rejects it with zero jobs). Check in shell instead.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write # create/update the apk-latest release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 requires node >= 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
            "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Decode release keystore (if secret is set)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "no ANDROID_KEYSTORE_B64 secret -> debug (auto-signed) APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK (release if keystore present, else debug)
        run: |
          set -o pipefail
          cd android
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### gradle $TASK failed (rc=$rc)"
              echo "java: $(java -version 2>&1 | head -1) | ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
              echo "platforms: $(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null | tr '\n' ' ')"
              echo "build-tools: $(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null | tr '\n' ' ')"
              echo '```'
              tail -80 /tmp/gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # surface the error in check-run annotations (readable via api.github.com)
            echo "::error::gradle $TASK failed rc=$rc java=$(java -version 2>&1 | head -1)"
            grep -E "FAILURE|What went wrong|error:|Exception|Caused by" /tmp/gradle.log | tail -12 | while IFS= read -r l; do echo "::error::$l"; done
            tail -20 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"

      # On build failure, push the gradle log to the ci-logs branch so it can be
      # read via api.github.com (the job-log download host is not allowlisted).
      - name: Dump build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            java -version 2>&1 | head -1
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "platforms: $(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null | tr '\n' ' ')"
            echo "build-tools: $(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null | tr '\n' ' ')"
            echo "cmdline-tools: $(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" 2>/dev/null | tr '\n' ' ')"
          } > "ci-logs/head-$GITHUB_RUN_ID.txt"
          cp /tmp/gradle.log "ci-logs/gradle-$GITHUB_RUN_ID.log" 2>/dev/null || echo "no gradle log captured" > "ci-logs/gradle-$GITHUB_RUN_ID.log"
          git config user.email "ci@lostless.app" && git config user.name "lostless-ci"
          git checkout -B ci-logs
          git add ci-logs
          git commit -m "ci log run $GITHUB_RUN_ID" || true
          git push -f origin ci-logs || echo "ci-logs push failed"

      - name: Collect APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" lostless.apk
          ls -la lostless.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lostless-apk
          path: lostless.apk
          retention-days: 30

      - name: Publish to GitHub Release (apk-latest) on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "lostless_ Android APK - built from main @ ${SHORT} on $(date -u +%Y-%m-%d) UTC."
            echo ""
            echo "Install: download the APK, allow 'Install unknown apps' for your browser or file manager, then open it."
            echo "First GPS use asks for the location permission."
            echo "100% free stack (OpenFreeMap tiles, Nominatim search, public Valhalla/OSRM routing), no API keys."
            echo "Web version: https://kiarashakbari.github.io/lostless/"
          } > /tmp/notes.md
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest lostless.apk --clobber
            gh release edit apk-latest --notes-file /tmp/notes.md
          else
            gh release create apk-latest lostless.apk --title "lostless_ Android APK (apk-latest)" --notes-file /tmp/notes.md
          fi
          gh release view apk-latest --json assets --jq '.assets[].name'
