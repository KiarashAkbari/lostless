name: CI — functional check

# Runs on every pull request and every push to main:
# install deps, run the unit tests, then verify the production build compiles.
# If any of these fail, the PR shows a red X and should not be merged.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
